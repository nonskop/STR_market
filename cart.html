<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корзина | Airsoft-Rus</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
    <div class="header-container">
        <div class="logo">
            <h1>AIRSOFT-RUS</h1>
            <span>силовая страйкбольная торговля</span>
        </div>

        <div class="nav-links">
            <a href="index.html">Каталог</a>
            <a href="#">Бренды</a>
            <a href="#">Акции</a>
            <a href="#">Доставка</a>
            <a href="#">Контакты</a>
        </div>

        <div style="display: flex; align-items: center;">
            <div class="auth-buttons" id="authSection">
                <button class="btn-outline" id="loginBtn"><i class="fas fa-user"></i> Войти</button>
                <button class="btn-solid" id="registerBtn"><i class="fas fa-user-plus"></i> Регистрация</button>
                <button class="btn-outline" id="logoutBtn" style="display: none;">
                    <i class="fas fa-sign-out-alt"></i> Выйти
                </button>
            </div>
            <div class="cart-icon" onclick="window.location.href='cart.html'">
                <i class="fas fa-shopping-cart"></i>
                <span class="cart-badge" id="cartCount">0</span>
            </div>
        </div>
    </div>
</header>

<main>
    <div class="cart-container">
        <div class="cart-header">
            <h1><i class="fas fa-shopping-cart"></i> Моя корзина</h1>
            <a href="index.html" class="back-to-shop">
                <i class="fas fa-arrow-left"></i> Продолжить покупки
            </a>
        </div>

        <div id="cartContent">
            <!-- Содержимое корзины будет загружено сюда -->
        </div>
    </div>
</main>

<footer>
    <div class="footer-content">
        <div style="color: #666; font-size: 0.9rem;">© 2026 AIRSOFT-RUS</div>
        <div></div>
        <div><i class="fab fa-telegram"></i> <i class="fab fa-youtube"></i></div>
    </div>
</footer>

<script src="cart.js"></script>
</body>
</html>
